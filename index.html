<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#35533C" />
<title>Plant Watch</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Plant Watch" />
<style>
  html, body { margin: 0; padding: 0; background: #F5F2E8; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/react-is@18.3.1/umd/react-is.production.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
<script>
  // Shim so the esbuild bundle's require("react") / require("react-dom/client")
  // / require("recharts") calls resolve to the UMD globals loaded above.
  window.require = function (name) {
    if (name === "react") return window.React;
    if (name === "react-dom/client") return window.ReactDOM;
    if (name === "react-dom") return window.ReactDOM;
    if (name === "react-is") return window.ReactIs;
    if (name === "recharts") return window.Recharts;
    throw new Error("Unknown module: " + name);
  };
</script>
<script src="app.bundle.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    });
  }
</script>
</body>
</html>
